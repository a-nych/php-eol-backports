name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.1"
            variant: fpm-bookworm
          - php: "8.0"
            variant: fpm-bullseye
          - php: "7.4"
            variant: fpm-bullseye
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.php }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ matrix.php }}-${{ matrix.variant }}
            ghcr.io/${{ github.repository }}:${{ matrix.php }}-${{ matrix.variant }}-${{ steps.sha.outputs.short }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
